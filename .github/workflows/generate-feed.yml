name: Genera feed RSS

# Il workflow ha una doppia attivazione, come richiesto:
# - INTERNA: uno "schedule" nativo di GitHub Actions, ogni ora.
#   (nota: gli schedule di GitHub Actions non sono garantiti al minuto
#   esatto e su repository poco attivi possono subire ritardi in caso di
#   carico sui runner condivisi di GitHub)
# - ESTERNA: un cronjob esterno (es. cron-job.org) che chiama ogni ora
#   l'endpoint GitHub API per innescare il workflow via workflow_dispatch:
#   POST https://api.github.com/repos/mbmichele/comunicaz_prov_mn/actions/workflows/generate-feed.yml/dispatches
#   body: {"ref":"main"}
#   header: Authorization: Bearer <PAT con permesso "Actions: write">
#
# Le due attivazioni sono indipendenti e ridondanti tra loro: se una delle
# due salta un'esecuzione, l'altra copre comunque l'aggiornamento orario.
# Può anche essere lanciato manualmente da GitHub ("Run workflow").
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera feed.xml
        run: python scripts/generate_feed.py

      - name: Commit e push se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/feed.xml; then
            echo "Nessuna modifica al feed."
            exit 0
          fi
          git add docs/feed.xml
          git commit -m "Aggiorna feed.xml [skip ci]"
          # Il cron interno e quello esterno possono scattare quasi nello
          # stesso istante: se nel frattempo un'altra esecuzione ha già
          # pushato, riallinea con rebase e riprova (fino a 5 volte) invece
          # di fallire.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rifiutato (probabile esecuzione concorrente), riprovo tra 5s..."
            sleep 5
            git fetch origin main
            git rebase origin/main
          done
          echo "Push fallito dopo 5 tentativi."
          exit 1
